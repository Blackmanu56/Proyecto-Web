schema: spec-driven

context: |
  Tech stack: Next.js 16, React 19, TypeScript 5.7, Prisma 7.8, PostgreSQL
  Architecture: App Router with src/ directory, Radix UI components, Tailwind CSS 4.2
  Testing: No test runner detected (strict_tdd disabled)
  Style: ESLint with Next.js core-web-vitals and TypeScript configs, no formatter

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "next build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas